version: '3.8'

services:
  bot:
    build: .
    container_name: venom_scraper_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./tg_indexer_session.session:/app/tg_indexer_session.session
    command: python3 bot.py

