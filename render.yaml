services:
  - type: web
    name: venom-scraper-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 run_bot_network.py
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: FOREX_BOT_TOKEN
        value: "8967863227:AAFVno4s0e3WkD5XGGNBJakGNU3O4kLOBEI"
      - key: PREDICTION_BOT_TOKEN
        value: "8712477067:AAEKbiPxgzYwsOVUx5wM6F5gboB9s32e5l8"
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./telegram_directory.db
      - key: REQUEST_DELAY_MIN
        value: "3.0"
      - key: REQUEST_DELAY_MAX
        value: "6.0"
      - key: BATCH_PAUSE_SECONDS
        value: "30.0"
      - key: MAX_MEMBERS_PER_GROUP
        value: "5000"
      - key: SEARCH_PAGE_SIZE
        value: "8"
      - key: ENABLE_WEB_SERVER
        value: "true"
      - key: PING_URL
        sync: false
